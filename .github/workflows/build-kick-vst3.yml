name: Build KICK VST3 for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout compatibility-fixed KICK source
        uses: actions/checkout@v4
        with:
          repository: KickEm-Tools/0700-AAM
          ref: main
          path: kick-source

      - name: Fix VST3 config header include path
        shell: pwsh
        run: |
          $pluginCmake = "$env:GITHUB_WORKSPACE/kick-source/Kick/apps/kickvst/CMakeLists.txt"

          if (-not (Test-Path $pluginCmake)) {
            throw "KICK VST3 CMakeLists.txt not found."
          }

          @'
          target_include_directories(kickvst PRIVATE "${CMAKE_BINARY_DIR}/apps/kick")
          '@ | Add-Content -Path $pluginCmake

          Write-Host "Added KICK generated config.h include directory."

      - name: Configure CMake
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "kick-source"
          $audio = (Join-Path $source "AudIO").Replace('\', '/')
          $protocol = (Join-Path $source "ComProtocol").Replace('\', '/')

          if (-not (Test-Path "$audio/juce_modules.cmake")) {
            throw "AudIO compatibility file is missing."
          }

          if (-not (Test-Path "$source/Kick/modules/3rdParty/juce_serialport/juce_serialport.h")) {
            throw "JUCE serial-port module is missing."
          }

          cmake -S "$source/Kick" -B build `
            -DKICK_VST_PLUGIN=ON `
            -DKICK_LINK_TESTS=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCPM_AudIO_SOURCE=$audio" `
            "-DCPM_COM_PROTOCOL_SOURCE=$protocol"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed."
          }
      - name: Diagnose missing signal header
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE/kick-source"

          Write-Host "Searching source files for signal/signal.h..."
          Get-ChildItem $root -Recurse -File -Include *.h,*.hpp,*.cpp,*.c,*.cmake,CMakeLists.txt |
            Select-String -Pattern 'signal/signal\.h' |
            ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }

          Write-Host "Searching for the actual signal.h file..."
          Get-ChildItem $root -Recurse -File -Filter signal.hpp |
            ForEach-Object { Write-Host $_.FullName }
      
      - name: Build KICK VST3
        shell: pwsh
        run: |
          cmake --build build --config Release --target kickvst --parallel 2 2>&1 | Tee-Object -FilePath build-error.log

          if ($LASTEXITCODE -ne 0) {
            Write-Host "===== BUILD ERROR DETAILS ====="
            Get-Content build-error.log -Tail 100
            exit 1
          }


      - name: Package VST3 plugin
        shell: pwsh
        run: |
          $plugins = Get-ChildItem build -Recurse -Directory -Filter "*.vst3"

          if (-not $plugins) {
            throw "No VST3 bundle found."
          }

          $plugin = $plugins | Select-Object -First 1

          Compress-Archive `
            -Path $plugin.FullName `
            -DestinationPath "$env:GITHUB_WORKSPACE/KICK-VST3-Windows.zip" `
            -Force

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: KICK-VST3-Windows
          path: KICK-VST3-Windows.zip
          if-no-files-found: error
          retention-days: 7
