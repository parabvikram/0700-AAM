name: Build KICK VST3 for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout compatibility-fixed KICK source
        uses: actions/checkout@v4
        with:
          repository: KickEm-Tools/0700-AAM
          ref: main
          path: kick-source

      - name: Configure CMake
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "kick-source"
          $audio = (Join-Path $source "AudIO").Replace('\', '/')
          $protocol = (Join-Path $source "ComProtocol").Replace('\', '/')

          if (-not (Test-Path "$audio/juce_modules.cmake")) {
            throw "AudIO compatibility file is missing."
          }

          if (-not (Test-Path "$source/Kick/modules/3rdParty/juce_serialport/juce_serialport.h")) {
            throw "JUCE serial-port module is missing."
          }

          cmake -S "$source/Kick" -B build `
            -DKICK_VST_PLUGIN=ON `
            -DKICK_LINK_TESTS=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCPM_AudIO_SOURCE=$audio" `
            "-DCPM_COM_PROTOCOL_SOURCE=$protocol"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed."
          }

            - name: Diagnose missing config.h
        shell: pwsh
        run: |
          Write-Host "Searching for config.h..."
          Get-ChildItem "$env:GITHUB_WORKSPACE/kick-source" -Filter "config.h" -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

          Write-Host "Searching for config.h templates..."
          Get-ChildItem "$env:GITHUB_WORKSPACE/kick-source" -Include "config.h.in","config.h.cmake","config.h.template" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

          Write-Host "Checking common module..."
          Get-ChildItem "$env:GITHUB_WORKSPACE/kick-source/Kick/modules/common" -Force | Select-Object Name

          Write-Host "Checking generated build files..."
          Get-ChildItem "$env:GITHUB_WORKSPACE/build" -Filter "config.h" -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName      - name: Diagnose missing config.h
        shell: pwsh
        run: |
          Write-Host "Searching for config.h..."
          Get-ChildItem "$env:GITHUB_WORKSPACE/kick-source" -Filter "config.h" -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

          Write-Host "Searching for config.h templates..."
          Get-ChildItem "$env:GITHUB_WORKSPACE/kick-source" -Include "config.h.in","config.h.cmake","config.h.template" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

          Write-Host "Checking common module..."
          Get-ChildItem "$env:GITHUB_WORKSPACE/kick-source/Kick/modules/common" -Force | Select-Object Name

          Write-Host "Checking generated build files..."
          Get-ChildItem "$env:GITHUB_WORKSPACE/build" -Filter "config.h" -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

          if ($LASTEXITCODE -ne 0) {
            throw "KICK VST3 compilation failed."
          }

      - name: 
        shell: pwsh
        run: |
          $plugins = Get-ChildItem build -Recurse -Directory -Filter "*.vst3"

          if (-not $plugins) {
            throw "No VST3 bundle found."
          }

          $plugin = $plugins | Select-Object -First 1

          Compress-Archive `
            -Path $plugin.FullName `
            -DestinationPath "$env:GITHUB_WORKSPACE/KICK-VST3-Windows.zip" `
            -Force

      - name: 
        uses: actions/upload-artifact@v4
        with:
          name: KICK-VST3-Windows
          path: KICK-VST3-Windows.zip
          if-no-files-found: error
          retention-days: 7
