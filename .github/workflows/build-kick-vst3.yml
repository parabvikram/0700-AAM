
name: Build KICK VST3 for Windows

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout KICK source
        uses: actions/checkout@v4
        with:
          repository: KickEm-Tools/0700-AAM
          path: kick-source

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Fix KICK VST3 include paths
        shell: pwsh
        run: |
          $thirdParty = "kick-source/Kick/modules/3rdParty"

          $signalFolder = "$thirdParty/signal"

          @'
          #pragma once
          #include "signal.hpp"
          '@ | Set-Content "$signalFolder/signal.h" -Encoding ascii

          $magicFolder = "$thirdParty/magic_enum"

          if (!(Test-Path "$magicFolder/magic_enum.hpp")) {
            throw "magic_enum.hpp is missing!"
          }

          @'
          #pragma once
          #include "magic_enum.hpp"
          '@ | Set-Content "$magicFolder/magic_enum.h" -Encoding ascii

          Write-Host "magic_enum compatibility header created."

          $cmakeFile = "kick-source/Kick/apps/kickvst/CMakeLists.txt"

          Add-Content $cmakeFile 'target_include_directories(kickvst PRIVATE "${CMAKE_BINARY_DIR}/apps/kick" "${CMAKE_SOURCE_DIR}/modules" "${CMAKE_SOURCE_DIR}/modules/3rdParty")'

      - name: Find magic_enum dependency
        shell: pwsh
        run: |
          Write-Host "Searching for magic_enum..."

          Get-ChildItem "kick-source" -Recurse -File -Filter "magic_enum.h" |
            Select-Object -ExpandProperty FullName

          Write-Host "Checking dependency folders..."

          Get-ChildItem "kick-source/Kick/modules/3rdParty" -Directory |
            Select-Object -ExpandProperty Name

      - name: Configure CMake
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE/kick-source/Kick"

          if (!(Test-Path "$root/modules/3rdParty/signal/signal.hpp")) {
            throw "signal.hpp was not found in the KICK source."
          }

          if (!(Test-Path "$root/../AudIO/juce_modules.cmake")) {
            Write-Host "Checking AudIO source location..."
          }

          cmake -S "$root" -B build `
            -DKICK_VST_PLUGIN=ON `
            -DKICK_LINK_TESTS=OFF `
            -DCMAKE_BUILD_TYPE=Release

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed."
          }

      - name: Find PktMgr header
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE/kick-source"

          Write-Host "Searching for PktMgr.h..."

          $matches = @(
            Get-ChildItem -Path $root -Recurse -File -Filter "PktMgr.h" `
              -ErrorAction SilentlyContinue
          )

          if ($matches.Count -eq 0) {
            Write-Host "RESULT: PktMgr.h NOT FOUND"
          } else {
            foreach ($file in $matches) {
              Write-Host "FOUND: $($file.FullName)"
            }
          }
         
            - name: Find PktMgr header
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE/kick-source"

          Write-Host "Searching for PktMgr.h..."

          $matches = @(
            Get-ChildItem -Path $root -Recurse -File -Filter "PktMgr.h" `
              -ErrorAction SilentlyContinue
          )

          if ($matches.Count -eq 0) {
            Write-Host "RESULT: PktMgr.h NOT FOUND"
          } else {
            foreach ($file in $matches) {
              Write-Host "FOUND: $($file.FullName)"
            }
          }

      - name: Find PktMgr references and dependencies
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE/kick-source"

          Write-Host "Searching for PktMgr references..."

          Get-ChildItem -Path $root -Recurse -File `
            -Include *.h,*.hpp,*.cpp,*.cmake,CMakeLists.txt |
            Select-String -Pattern "PktMgr|PktMgr.h" |
            ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }

          Write-Host "Checking Git submodules..."

          if (Test-Path "$root/.gitmodules") {
            Get-Content "$root/.gitmodules"
          } else {
            Write-Host "No .gitmodules file found."
          }   
      - name: Build KICK VST3 and diagnose errors
        shell: pwsh
        run: |
          Write-Host "Starting KICK VST3 build..."

          cmake --build build --config Release --target kickvst --parallel 2
          $buildExit = $LASTEXITCODE

          $header = "build/apps/kickvst/kickvst_artefacts/JuceLibraryCode/JuceHeader.h"

          Write-Host "Checking generated JUCE header..."

          if (Test-Path $header) {
            Get-Content $header | Select-Object -First 45
          } else {
            Write-Host "JuceHeader.h was not generated."
          }

          Write-Host "Searching source for magic_enum references..."

          Get-ChildItem "kick-source" -Recurse -File `
            -Include *.h,*.hpp,*.cpp,*.cmake,CMakeLists.txt |
            Select-String -Pattern "magic_enum" |
            Select-Object -First 40

          if ($buildExit -ne 0) {
            throw "KICK VST3 build failed. Exit code: $buildExit"
          }

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: KICK-VST3-Windows
          path: build/**/kickvst_artefacts/Release/VST3/**/*.vst3
          if-no-files-found: warn
